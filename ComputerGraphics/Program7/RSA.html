<html>
<head>
<title>RSA Encryption</title>
</head>
<body>
<center>
<h1>RSA Algorithm</h1>
<table>
<tr><td>Prime P:</td><td><input id="p" value="53"></td></tr>
<tr><td>Prime Q:</td><td><input id="q" value="59"></td></tr>
<tr><td>Message (A=1..Z=26):</td><td><input id="msg" value="89"></td></tr>
<tr><td>Public Key (n):</td><td><p id="publickey"></p></td></tr>
<tr><td>Exponent (e):</td><td><p id="exponent"></p></td></tr>
<tr><td>Private Key (d):</td><td><p id="privatekey"></p></td></tr>
<tr><td>Cipher Text:</td><td><p id="ciphertext"></p></td></tr>
<tr><td><button onclick="RSA()">Apply RSA</button></td></tr>
</table>
</center>
<script>
function gcd(a, b) { return b ? gcd(b, a % b) : a; }
function RSA() {
const p = +document.getElementById('p').value;
const q = +document.getElementById('q').value;
const msg = +document.getElementById('msg').value;
const n = p * q;
const t = (p - 1) * (q - 1);
let e = 2;
while (gcd(e, t) !== 1) e++;
let d = 0;
for (let i = 0; i < t; i++) {
if ((1 + i * t) % e === 0) { d = (1 + i * t) / e; break; }
}
const cipherText = Math.pow(msg, e) % n;
document.getElementById('publickey').innerText = n;
document.getElementById('exponent').innerText = e;
document.getElementById('privatekey').innerText = d;
document.getElementById('ciphertext').innerText = cipherText;
}
</script>
</body>
</html>
